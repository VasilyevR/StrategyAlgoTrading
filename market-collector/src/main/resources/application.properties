spring.config.import=classpath:common-platform.properties,optional:file:.env[.properties]
# ============================================================================
# Market Collector Service Configuration
# ============================================================================

spring.application.name=market-collector
server.port=8081

services.internal-token=${INTERNAL_SERVICE_TOKEN:dev-internal-token-change-me}

spring.kafka.consumer.group-id=market-collector-group
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

market-collector.bybit-rest-base-url=${BYBIT_REST_BASE_URL:https://api.bybit.com}
market-collector.bybit-websocket-base-url=${BYBIT_WS_BASE_URL:wss://stream.bybit.com/v5/public/}
market-collector.backfill-limit=${BYBIT_BACKFILL_LIMIT:200}
market-collector.heartbeat-interval-seconds=${BYBIT_HEARTBEAT_INTERVAL_SECONDS:20}
market-collector.reconnect-initial-delay-millis=${BYBIT_RECONNECT_INITIAL_DELAY_MILLIS:1000}
market-collector.reconnect-max-delay-millis=${BYBIT_RECONNECT_MAX_DELAY_MILLIS:60000}
