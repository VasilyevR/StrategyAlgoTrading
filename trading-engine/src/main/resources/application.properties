spring.config.import=classpath:common-platform.properties,optional:file:.env[.properties]
# ============================================================================
# Trade Engine Service Configuration
# ============================================================================
spring.application.name=trade-engine
server.port=8082

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# Apache Kafka (KRaft)
spring.kafka.consumer.group-id=trade-engine-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=rv.trading.strategy.contracts.*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.listener.ack-mode=manual_immediate

# Trading engine / Bybit configuration
trading-engine.bybit-live-base-url=${BYBIT_LIVE_BASE_URL:https://api.bybit.com}
trading-engine.bybit-demo-base-url=${BYBIT_DEMO_BASE_URL:https://api-demo.bybit.com}
trading-engine.bybit-recv-window-millis=${BYBIT_RECV_WINDOW_MS:5000}
trading-engine.master-encryption-key=${MASTER_ENCRYPTION_KEY:}
