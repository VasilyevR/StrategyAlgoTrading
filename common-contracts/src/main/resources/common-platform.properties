# ============================================================================
# Shared Platform Configuration (imported by portal-api, trade-engine, market-collector)
# ============================================================================
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s

# Java 25 Virtual Threads
spring.threads.virtual.enabled=true

# PostgreSQL & JPA Defaults
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:trading_dev}
spring.datasource.username=${POSTGRES_USER:trading}
spring.datasource.password=${POSTGRES_PASSWORD:trading_secret}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Apache Kafka (KRaft)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}

# Inter-Service URLs & Shared Internal Token
services.portal-api.url=${PORTAL_API_URL:http://localhost:8080}
services.market-collector.url=${MARKET_COLLECTOR_URL:http://localhost:8081}
services.trade-engine.url=${TRADE_ENGINE_URL:http://localhost:8082}
services.internal-token=${INTERNAL_SERVICE_TOKEN:dev-internal-token-change-me}

# AES-256-GCM Master Key (used by portal-api & trade-engine)
security.crypto.master-key=${CRYPTO_MASTER_KEY:-}

# Actuator Probes (Docker Compose & k3s)
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Logging
logging.level.rv.trading.strategy=DEBUG